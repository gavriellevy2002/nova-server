<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Nova</title>

<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/icon-180.png">
<link rel="icon" href="/icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Nova">
<meta name="theme-color" content="#06040f">

<style>
:root{
  --bg:#06040f; --ink:#e9e6ff; --dim:#8b86ad;
  --teal:#4be8d0; --violet:#9d7bff; --gold:#fcd34d; --red:#ff6b6b;
  --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--ink);display:flex;flex-direction:column;position:relative}

/* ---------- ambient aura ---------- */
#aura{position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(60% 45% at 50% 30%, rgba(157,123,255,.20), transparent 70%),
             radial-gradient(90% 70% at 50% 110%, rgba(75,232,208,.10), transparent 70%),
             var(--bg);
  transition:opacity .5s}
#aura.live{animation:breathe 3.4s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.75}50%{opacity:1}}

/* ---------- header ---------- */
header{position:relative;z-index:2;padding:calc(var(--st) + 12px) 16px 8px;
  display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{font-family:Georgia,"Times New Roman",serif;letter-spacing:.42em;font-size:16px;
  display:flex;align-items:center;gap:8px}
.brand i{color:var(--teal);font-style:normal;font-size:13px}
.hbtns{display:flex;align-items:center;gap:6px}
.chip{background:rgba(150,140,255,.12);border:1px solid rgba(150,140,255,.25);
  color:var(--ink);border-radius:999px;padding:6px 11px;font-size:12px;cursor:pointer;
  white-space:nowrap;transition:.15s}
.chip:active{transform:scale(.94)}
.chip.on{background:rgba(75,232,208,.16);border-color:rgba(75,232,208,.45);color:var(--teal)}
#pend{color:var(--gold);border-color:rgba(252,211,77,.4);background:rgba(252,211,77,.1);display:none}

/* ---------- orb ---------- */
#orbWrap{position:relative;z-index:2;height:104px;display:flex;align-items:center;
  justify-content:center;flex:none;transition:height .35s}
#orbWrap.mini{height:56px}
#orb{width:70px;height:70px;border-radius:50%;position:relative;transition:.35s;
  background:radial-gradient(circle at 34% 32%, #fff9, #9d7bff 42%, #3d2a7a 74%, #140d33);
  box-shadow:0 0 34px 6px rgba(157,123,255,.42), inset 0 0 22px rgba(255,255,255,.14)}
#orbWrap.mini #orb{width:40px;height:40px}
#orb::after{content:"";position:absolute;inset:-16px;border-radius:50%;
  border:1px solid rgba(157,123,255,.22)}
body.listening #orb{background:radial-gradient(circle at 34% 32%, #fffc, #4be8d0 42%, #1c6b60 74%, #062622);
  box-shadow:0 0 48px 12px rgba(75,232,208,.55), inset 0 0 22px rgba(255,255,255,.2);
  animation:pulse .9s ease-in-out infinite}
body.thinking #orb{animation:spin 1.5s linear infinite;
  box-shadow:0 0 40px 8px rgba(157,123,255,.6), inset 0 0 22px rgba(255,255,255,.18)}
body.speaking #orb{background:radial-gradient(circle at 34% 32%, #fff9, #4be8d0 38%, #6d5bd0 76%, #140d33);
  box-shadow:0 0 56px 14px rgba(75,232,208,.5), inset 0 0 22px rgba(255,255,255,.2);
  animation:wave 1.1s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.13)}}
@keyframes wave{0%,100%{transform:scale(1)}30%{transform:scale(1.07)}60%{transform:scale(.97)}}
@keyframes spin{to{transform:rotate(360deg)}}
body.listening #aura,body.speaking #aura{opacity:1;
  background:radial-gradient(65% 50% at 50% 28%, rgba(75,232,208,.26), transparent 70%),
             radial-gradient(90% 70% at 50% 110%, rgba(157,123,255,.14), transparent 70%),
             var(--bg)}

#state{position:relative;z-index:2;text-align:center;font-size:12px;color:var(--dim);
  height:16px;margin-bottom:2px}

/* ---------- log ---------- */
#log{position:relative;z-index:2;flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:8px 14px 4px;display:flex;flex-direction:column;gap:9px}
.m{max-width:88%;padding:11px 14px;border-radius:16px;font-size:15px;line-height:1.6;
  white-space:pre-wrap;word-wrap:break-word;animation:rise .22s ease-out}
@keyframes rise{from{opacity:0;transform:translateY(7px)}}
.u{align-self:flex-end;background:#2a2352;border-bottom-right-radius:5px}
.n{align-self:flex-start;background:rgba(75,232,208,.09);border:1px solid rgba(75,232,208,.2);
  border-bottom-left-radius:5px}
.n.err{background:rgba(255,107,107,.1);border-color:rgba(255,107,107,.35);color:#ffc9c9}
.replay{align-self:flex-start;background:none;border:none;color:var(--teal);font-size:12px;
  cursor:pointer;padding:2px 6px;margin-top:-5px}

/* ---------- quick chips ---------- */
#quick{position:relative;z-index:2;display:flex;gap:7px;overflow-x:auto;padding:6px 14px;
  scrollbar-width:none}
#quick::-webkit-scrollbar{display:none}
#quick .chip{font-size:12px;flex:none}

/* ---------- composer ---------- */
form{position:relative;z-index:2;display:flex;gap:8px;align-items:center;
  padding:8px 12px calc(var(--sb) + 12px)}
#in{flex:1;min-width:0;background:rgba(150,140,255,.09);border:1px solid rgba(150,140,255,.2);
  border-radius:999px;color:var(--ink);padding:14px 18px;font-size:16px;outline:none}
#in:focus{border-color:rgba(75,232,208,.45)}
.rnd{width:50px;height:50px;flex:none;border-radius:50%;border:none;font-size:20px;
  display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.15s}
.rnd:active{transform:scale(.92)}
#mic{background:rgba(150,140,255,.16);border:1px solid rgba(150,140,255,.3);color:var(--ink)}
#mic.on{background:var(--teal);color:#04110e;border-color:var(--teal);
  box-shadow:0 0 20px rgba(75,232,208,.55)}
#go{background:var(--teal);color:#04110e;font-weight:700}

/* ---------- gate & sheets ---------- */
#gate{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;
  flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:26px;text-align:center}
#gate.hide{display:none}
#gate input{width:min(360px,88vw);text-align:center;background:rgba(150,140,255,.1);
  border:1px solid rgba(150,140,255,.25);border-radius:14px;color:var(--ink);
  padding:14px;font-size:16px;outline:none}
#gate button{background:var(--teal);color:#04110e;font-weight:700;border:none;
  border-radius:14px;padding:13px 34px;font-size:16px;cursor:pointer}
#gateMsg{font-size:13px;min-height:18px;color:var(--red)}

.sheet{position:fixed;inset:0;z-index:15;background:rgba(6,4,15,.9);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);display:none;
  flex-direction:column;padding:calc(var(--st) + 18px) 18px calc(var(--sb) + 18px)}
.sheet.show{display:flex}
.sheet h3{font-size:17px;margin-bottom:12px;font-weight:600}
.sheet .body{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:10px}
.card{background:rgba(150,140,255,.08);border:1px solid rgba(150,140,255,.18);
  border-radius:14px;padding:13px;font-size:14px;line-height:1.55}
.card b{color:var(--teal);font-weight:600}
.card .row{display:flex;gap:8px;margin-top:10px}
.card .row button{flex:1;border:none;border-radius:10px;padding:9px;font-size:13px;
  font-weight:600;cursor:pointer}
.ok{background:var(--teal);color:#04110e}
.no{background:rgba(255,107,107,.18);color:#ffb4b4}
.sheet>.close{margin-top:12px;background:rgba(150,140,255,.14);border:none;color:var(--ink);
  border-radius:14px;padding:13px;font-size:15px;cursor:pointer}
.muted{color:var(--dim);font-size:13px;line-height:1.6}
</style>
</head>
<body>
<div id="aura" class="live"></div>

<!-- ============ token gate ============ -->
<div id="gate">
  <div class="brand" style="font-size:22px">N O V A <i>✦</i></div>
  <div class="muted">Paste your access code</div>
  <input id="tok" placeholder="NOVA_TOKEN" autocapitalize="off" autocorrect="off" spellcheck="false" type="password">
  <button onclick="tryToken()">Enter</button>
  <div id="gateMsg"></div>
</div>

<!-- ============ app ============ -->
<header>
  <div class="brand">N O V A <i>✦</i></div>
  <div class="hbtns">
    <button class="chip" id="pend" onclick="openPending()"></button>
    <button class="chip" id="wakeBtn" onclick="toggleWake()" title="Always listening">👂</button>
    <button class="chip" onclick="openMenu()">☰</button>
  </div>
</header>

<div id="orbWrap"><div id="orb"></div></div>
<div id="state"></div>
<div id="log"></div>

<div id="quick">
  <button class="chip" onclick="quick('Research this and email me a summary: ')">📧 Research → email</button>
  <button class="chip" onclick="quick('What scheduled tasks do I have?')">⏰ My tasks</button>
  <button class="chip" onclick="quick('What should I know today?')">📰 Briefing</button>
  <button class="chip" onclick="quick('What do you remember about me?')">🧠 Memory</button>
</div>

<form onsubmit="send(event)">
  <input id="in" placeholder="Talk to Nova…" autocomplete="off" autocorrect="off">
  <button type="button" class="rnd" id="mic" onclick="toggleMic()">🎙</button>
  <button type="submit" class="rnd" id="go">↑</button>
</form>

<!-- ============ sheets ============ -->
<div class="sheet" id="pendSheet">
  <h3>⚠ Emails waiting for your approval</h3>
  <div class="body" id="pendBody"></div>
  <button class="close" onclick="closeSheet('pendSheet')">Close</button>
</div>

<div class="sheet" id="menuSheet">
  <h3>Settings</h3>
  <div class="body" id="menuBody"></div>
  <button class="close" onclick="closeSheet('menuSheet')">Close</button>
</div>

<script>
'use strict';
const $ = s => document.querySelector(s);
const LS = { tok:'nv_tok', voice:'nv_voiceOn', wake:'nv_wake' };
const LANG = 'en';

let TOKEN    = localStorage.getItem(LS.tok) || '';
let VOICE_ON = localStorage.getItem(LS.voice) !== '0';
let busy = false;

/* ================= state / aura ================= */
function setState(mode, text) {
  document.body.classList.remove('listening','thinking','speaking');
  if (mode) document.body.classList.add(mode);
  $('#state').textContent = text || '';
}

/* ================= token gate ================= */
if (TOKEN) $('#gate').classList.add('hide');

async function tryToken() {
  const v = $('#tok').value.trim();
  if (!v) { $('#gateMsg').textContent = 'Enter your code'; return; }
  $('#gateMsg').style.color = 'var(--dim)';
  $('#gateMsg').textContent = 'Checking…';
  try {
    const r = await fetch('/api/tasks', { headers:{ 'x-nova-token': v } });
    if (r.status === 401) {
      $('#gateMsg').style.color = 'var(--red)';
      $('#gateMsg').textContent = 'Wrong code — this is your NOVA_TOKEN from Render';
      return;
    }
    TOKEN = v;
    localStorage.setItem(LS.tok, v);
    $('#gate').classList.add('hide');
    $('#gateMsg').textContent = '';
    unlockAudio();
    boot();
  } catch (e) {
    $('#gateMsg').style.color = 'var(--red)';
    $('#gateMsg').textContent = 'Cannot reach the server';
  }
}
$('#tok').addEventListener('keydown', e => { if (e.key === 'Enter') tryToken(); });

/* ================= chat ================= */
function add(who, text, isErr) {
  const d = document.createElement('div');
  d.className = 'm ' + who + (isErr ? ' err' : '');
  d.textContent = text;
  $('#log').appendChild(d);
  $('#log').scrollTop = 1e9;
  return d;
}

function quick(t) {
  $('#in').value = t;
  if (t.trim().endsWith(':')) { $('#in').focus(); return; }   // needs the user to finish the sentence
  send(new Event('x'));
}

async function send(e) {
  if (e && e.preventDefault) e.preventDefault();
  const text = $('#in').value.trim();
  if (!text || busy) return;
  $('#in').value = '';
  pauseRec();          // mic stays shut until she finishes answering
  add('u', text);
  busy = true;
  setState('thinking', 'Nova is thinking…');
  $('#orbWrap').classList.add('mini');
  const bubble = add('n', '…');

  try {
    const r = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type':'application/json', 'x-nova-token': TOKEN },
      body: JSON.stringify({ message: text })
    });
    if (r.status === 401) throw new Error('Access code rejected. Open ☰ → Change access code.');
    const j = await r.json();
    if (j.error) throw new Error(j.error);
    bubble.textContent = j.reply;
    refreshPending(j.pending);
    setState(null, '');
    speak(j.reply);
  } catch (err) {
    bubble.textContent = 'Error: ' + err.message;
    bubble.classList.add('err');
    setState(null, '');
    resumeRec();                 // never leave the mic stuck closed after a failure
  } finally {
    busy = false;
    $('#log').scrollTop = 1e9;
  }
}

/* ================= speech OUT =================
   Two engines: ElevenLabs through our own server (the key never touches the
   browser), and the browser's built-in voice as a free fallback. iOS only lets
   audio play from a chain that began with a real user gesture, so we build ONE
   <audio> element on the first touch and reuse it forever. */
const SILENT_WAV = 'data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAgD4AAAB9AAACABAAZGF0YQAAAAA=';
let audioReady = false;
let player = null;
let HEALTH = { voiceReady:false };
let elFails = 0;

function unlockAudio() {
  if (audioReady) return;
  audioReady = true;
  try {
    const u = new SpeechSynthesisUtterance(' ');
    u.volume = 0;
    speechSynthesis.speak(u);
  } catch (e) {}
  try {
    player = new Audio();
    player.preload = 'auto';
    player.src = SILENT_WAV;
    const p = player.play();
    if (p && p.catch) p.catch(() => {});
  } catch (e) {}
}
document.addEventListener('touchstart', unlockAudio, { once:true });
document.addEventListener('click', unlockAudio, { once:true });

let voices = [];
function loadVoices() { voices = speechSynthesis.getVoices() || []; }
loadVoices();
if (typeof speechSynthesis !== 'undefined') speechSynthesis.onvoiceschanged = loadVoices;

function pickVoice() {
  if (!voices.length) loadVoices();
  const pool = voices.filter(v => (v.lang || '').toLowerCase().startsWith('en'));
  if (!pool.length) return null;
  const nice = ['Samantha','Ava','Allison','Siri','Google US','Premium','Enhanced','Neural'];
  for (const n of nice) {
    const hit = pool.find(v => (v.name || '').includes(n));
    if (hit) return hit;
  }
  return pool[0];
}

function clean(t) {
  return String(t)
    .replace(/```[\s\S]*?```/g, ' ')
    .replace(/https?:\/\/\S+/g, ' ')
    .replace(/[*_#`>|~\[\]]/g, ' ')
    .replace(/\s+/g, ' ')
    .trim()
    .slice(0, 900);
}

function speak(text) {
  if (!VOICE_ON || !text) { resumeRec(); return; }
  const say = clean(text);
  if (!say) { resumeRec(); return; }
  stopAllAudio();
  if (HEALTH.voiceReady && elFails < 2) speakEleven(say);
  else speakBrowser(say);
}

function stopAllAudio() {
  try { speechSynthesis.cancel(); } catch (e) {}
  if (player) { try { player.pause(); } catch (e) {} }
}

let lastBlobUrl = null;
async function speakEleven(say) {
  setState('thinking', 'Generating voice…');
  try {
    const r = await fetch('/api/speak', {
      method:'POST',
      headers:{ 'Content-Type':'application/json', 'x-nova-token': TOKEN },
      body: JSON.stringify({ text: say, lang: LANG })
    });
    if (!r.ok) throw new Error('tts ' + r.status);
    const blob = await r.blob();
    if (!blob.size) throw new Error('empty audio');

    if (!player) player = new Audio();
    if (lastBlobUrl) { URL.revokeObjectURL(lastBlobUrl); lastBlobUrl = null; }
    lastBlobUrl = URL.createObjectURL(blob);

    player.onplay  = () => setState('speaking', 'Speaking…');
    player.onended = () => { setState(null,''); resumeRec(); };
    player.onerror = () => { elFails++; speakBrowser(say); };

    player.src = lastBlobUrl;
    const p = player.play();
    if (p && p.catch) p.catch(() => offerTapAudio());
    elFails = 0;
  } catch (e) {
    elFails++;
    if (elFails === 2) add('n', 'Human voice unavailable — falling back to the built-in voice. Check ELEVEN_KEY on Render, or your ElevenLabs credits.', true);
    speakBrowser(say);
  }
}

function offerTapAudio() {
  const b = document.createElement('button');
  b.className = 'replay';
  b.textContent = '🔊 Tap to play';
  b.onclick = () => { b.remove(); if (player) player.play().catch(() => {}); };
  $('#log').appendChild(b);
  $('#log').scrollTop = 1e9;
  setState(null, '');
}

let speakTimer = null;
function speakBrowser(say) {
  try { speechSynthesis.cancel(); } catch (e) {}
  const u = new SpeechSynthesisUtterance(say);
  u.lang = 'en-US';
  const v = pickVoice();
  if (v) u.voice = v;
  u.rate = 1.0; u.pitch = 1.02;

  let started = false;
  u.onstart = () => { started = true; clearTimeout(speakTimer); setState('speaking','Speaking…'); };
  u.onend   = () => { setState(null,''); resumeRec(); };
  u.onerror = () => { setState(null,''); resumeRec(); };

  clearTimeout(speakTimer);
  speakTimer = setTimeout(() => {
    if (!started) {
      setState(null,'');
      offerTapBrowser(say);
      resumeRec();
    }
  }, 1700);

  try { speechSynthesis.speak(u); }
  catch (e) { offerTapBrowser(say); }
}

function offerTapBrowser(say) {
  const b = document.createElement('button');
  b.className = 'replay';
  b.textContent = '🔊 Tap to hear (check the silent switch on the side)';
  b.onclick = () => {
    b.remove();
    const u = new SpeechSynthesisUtterance(say);
    u.lang = 'en-US';
    const v = pickVoice(); if (v) u.voice = v;
    u.onstart = () => setState('speaking','Speaking…');
    u.onend = () => setState(null,'');
    speechSynthesis.speak(u);
  };
  $('#log').appendChild(b);
  $('#log').scrollTop = 1e9;
}

/* ================= speech IN =================
   Two ways to talk to her:
     • push-to-talk  — tap the mic, speak, it sends when you stop.
     • always-on 👂  — the mic never closes. She ignores everything until she
                       hears "Hey Nova", then captures whatever follows.
   The mic is deliberately closed while she thinks and speaks, otherwise she
   hears her own voice through the speaker and answers herself. Right after she
   finishes there is a grace window where you can reply WITHOUT the wake word,
   so a real back-and-forth doesn't need "Hey Nova" every single turn. */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const WAKE_RE  = /\b(?:hey|hi|ok|okay|yo)[,\s]+nova\b|^\s*nova\b/i;
const GRACE_MS = 12000;   // reply without the wake word for this long after she speaks
const PAUSE_MS = 1300;    // silence that means "I finished my sentence"

let rec = null;
let recRunning = false;
let wakeMode  = localStorage.getItem(LS.wake) === '1';
let paused    = false;    // true while she is thinking or speaking
let armed     = false;    // true once the wake word landed (or we're in grace)
let graceUntil = 0;
let pauseTimer = null;
let finalBuf  = '';
let idleTail  = '';   // rolling tail of ignored speech, for split wake phrases
let failStreak = 0, lastStart = 0;

function micSupported() { return !!SR; }

function buildRec() {
  const r = new SR();
  r.lang = 'en-US';
  r.continuous = wakeMode;      // only hold the mic open in always-on mode
  r.interimResults = true;
  r.maxAlternatives = 1;
  r.onstart  = () => { recRunning = true; paintMic(); showIdleListening(); };
  r.onresult = handleResult;
  r.onerror  = handleError;
  r.onend    = handleEnd;
  return r;
}

function showIdleListening() {
  if (paused) return;
  if (wakeMode && !armed) setState('listening', 'Say "Hey Nova"');
  else setState('listening', 'Listening…');
}

function handleResult(ev) {
  let interim = '', finals = '';
  for (let i = ev.resultIndex; i < ev.results.length; i++) {
    const t = ev.results[i][0].transcript;
    if (ev.results[i].isFinal) finals += t + ' '; else interim += t;
  }
  const fresh = (finals + ' ' + interim).replace(/\s+/g, ' ').trim();

  if (!wakeMode) {                       // push-to-talk: every word counts
    finalBuf += finals;
    $('#in').value = (finalBuf + interim).trim();
    return;
  }

  if (!armed) {
    if (!fresh) return;
    if (Date.now() < graceUntil) {
      armed = true; finalBuf = '';       // mid-conversation, no wake word needed
    } else {
      // Look in this utterance first, so a bare "Nova, ..." still counts even
      // when unrelated chatter came before it. Then look across the boundary,
      // in case "hey" and "nova" landed in separate result events.
      let m = WAKE_RE.exec(fresh), src = fresh;
      if (!m) {
        const probe = (idleTail + ' ' + fresh).replace(/\s+/g, ' ').trim();
        m = WAKE_RE.exec(probe); src = probe;
      }
      if (!m) { idleTail = fresh.slice(-60); return; }   // rolling window, never grows
      idleTail = '';
      armed = true;
      finalBuf = src.slice(m.index + m[0].length).trim() + ' ';
      blip();
      const first = finalBuf.trim();
      $('#in').value = first;
      setState('listening', 'Listening…');
      clearTimeout(pauseTimer);
      if (first) pauseTimer = setTimeout(submitVoice, PAUSE_MS);
      return;
    }
  }

  finalBuf += finals;
  const cmd = (finalBuf + interim).trim();
  $('#in').value = cmd;
  setState('listening', 'Listening…');
  clearTimeout(pauseTimer);
  if (cmd) pauseTimer = setTimeout(submitVoice, PAUSE_MS);
}

function submitVoice() {
  const t = $('#in').value.trim();
  finalBuf = ''; armed = false;
  if (!t) return;
  pauseRec();
  send(new Event('x'));
}

function handleError(ev) {
  if (ev.error === 'not-allowed' || ev.error === 'service-not-allowed') {
    wakeMode = false; localStorage.setItem(LS.wake, '0'); paintWake();
    stopRec();
    add('n', 'Microphone permission denied. iPhone: Settings → Safari → Microphone → Allow. Mac: click the lock icon in the address bar → Microphone → Allow.', true);
  }
  // no-speech / aborted / network all fall through to onend, which restarts
}

function handleEnd() {
  recRunning = false;
  paintMic();
  clearTimeout(pauseTimer);

  if (!wakeMode) {                        // push-to-talk: send what was captured
    const said = $('#in').value.trim();
    finalBuf = '';
    setState(null, '');
    if (said) send(new Event('x'));
    return;
  }

  if (paused) { setState(null, ''); return; }

  // always-on: browsers close the mic periodically. Just reopen it.
  const now = Date.now();
  failStreak = (now - lastStart < 500) ? failStreak + 1 : 0;
  if (failStreak > 6) {
    wakeMode = false; localStorage.setItem(LS.wake, '0'); paintWake();
    setState(null, '');
    add('n', 'Your browser keeps closing the mic, so I stopped always-on listening. On iPhone this is an Apple limitation — use the mic button there, or run always-on from the Mac. Tap the ear icon to try again.', true);
    return;
  }
  setTimeout(startRec, 250);
}

function startRec() {
  if (!micSupported() || recRunning || paused || busy) return;
  unlockAudio();
  if (!rec) rec = buildRec();
  lastStart = Date.now();
  try { rec.start(); }
  catch (e) {
    try { rec.abort(); } catch (e2) {}
    rec = buildRec();
    try { rec.start(); } catch (e3) { recRunning = false; }
  }
}

function stopRec() {
  clearTimeout(pauseTimer);
  finalBuf = ''; idleTail = ''; armed = false;
  if (rec) { try { rec.stop(); } catch (e) {} }
  recRunning = false;
  paintMic();
}

/* close the mic while she talks so she cannot hear herself */
function pauseRec() {
  paused = true;
  clearTimeout(pauseTimer);
  if (rec) { try { rec.stop(); } catch (e) {} }
  recRunning = false;
  paintMic();
}

function resumeRec() {
  paused = false;
  finalBuf = ''; idleTail = ''; armed = false;
  graceUntil = Date.now() + GRACE_MS;   // answer her without saying the wake word
  if (wakeMode) setTimeout(startRec, 300);
}

function paintMic() { $('#mic').classList.toggle('on', recRunning); }

/* short chime so you know the wake word registered */
function blip() {
  try {
    const C = window.AudioContext || window.webkitAudioContext;
    if (!C) return;
    const ctx = blip.ctx || (blip.ctx = new C());
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = 'sine'; o.frequency.value = 880;
    g.gain.setValueAtTime(0.0001, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.12, ctx.currentTime + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.16);
    o.connect(g); g.connect(ctx.destination);
    o.start(); o.stop(ctx.currentTime + 0.18);
  } catch (e) {}
}

function toggleMic() {
  if (!micSupported()) {
    add('n','This browser does not support speech recognition. Use Safari on iPhone, or Chrome/Safari on Mac.', true);
    return;
  }
  if (wakeMode) {                 // manual arm — skip having to say "Hey Nova"
    armed = true; finalBuf = '';
    graceUntil = Date.now() + GRACE_MS;
    if (!recRunning) startRec(); else setState('listening','Listening…');
    return;
  }
  if (recRunning) { stopRec(); setState(null,''); } else { startRec(); }
}

/* ================= always-on mode ================= */
function toggleWake() {
  if (!micSupported()) {
    add('n','This browser does not support speech recognition. Use Safari on iPhone, or Chrome/Safari on Mac.', true);
    return;
  }
  wakeMode = !wakeMode;
  localStorage.setItem(LS.wake, wakeMode ? '1' : '0');
  paintWake();
  stopRec();
  rec = null;                     // the continuous flag only applies to a fresh instance
  if (wakeMode) {
    add('n','Always-on is live. The mic stays open — just say "Hey Nova" and I wake up. For about 12 seconds after I answer you can keep talking without the wake word.');
    paused = false;
    startRec();
  } else {
    setState(null,'');
  }
}
function paintWake() { $('#wakeBtn').classList.toggle('on', wakeMode); }

/* ================= pending emails ================= */
async function refreshPending(n) {
  if (n === undefined) {
    try {
      const r = await fetch('/api/pending', { headers:{ 'x-nova-token': TOKEN } });
      if (!r.ok) { n = 0; } else { const j = await r.json(); n = Array.isArray(j) ? j.length : 0; }
    } catch (e) { n = 0; }
  }
  const el = $('#pend');
  el.style.display = n ? 'block' : 'none';
  el.textContent = n ? ('⚠ ' + n) : '';
}

async function openPending() {
  const body = $('#pendBody');
  body.innerHTML = '<div class="muted">Loading…</div>';
  $('#pendSheet').classList.add('show');
  let list = [];
  try {
    const r = await fetch('/api/pending', { headers:{ 'x-nova-token': TOKEN } });
    list = await r.json();
  } catch (e) {}
  if (!list.length) { body.innerHTML = '<div class="muted">Nothing waiting.</div>'; return; }
  body.innerHTML = '';
  list.forEach(p => {
    const c = document.createElement('div');
    c.className = 'card';
    const head = document.createElement('div');
    head.innerHTML = '<b>To:</b> ' + esc(p.to) + '<br><b>Subject:</b> ' + esc(p.subject || '');
    const pre = document.createElement('div');
    pre.style.cssText = 'margin-top:8px;color:var(--dim);white-space:pre-wrap;max-height:200px;overflow:auto';
    pre.textContent = p.body || '';
    const row = document.createElement('div');
    row.className = 'row';
    const yes = document.createElement('button');
    yes.className = 'ok'; yes.textContent = '✓ Send';
    yes.onclick = () => act('/api/approve', p.id, c);
    const no = document.createElement('button');
    no.className = 'no'; no.textContent = '✕ Discard';
    no.onclick = () => act('/api/reject', p.id, c);
    row.append(yes, no);
    c.append(head, pre, row);
    body.appendChild(c);
  });
}

async function act(url, id, card) {
  card.style.opacity = '.45';
  try {
    const r = await fetch(url, {
      method:'POST',
      headers:{ 'Content-Type':'application/json', 'x-nova-token': TOKEN },
      body: JSON.stringify({ id })
    });
    const j = await r.json();
    if (j.error) throw new Error(j.error);
    card.remove();
  } catch (e) {
    card.style.opacity = '1';
    alert('Error: ' + e.message);
  }
  refreshPending();
  if (!$('#pendBody').children.length) $('#pendBody').innerHTML = '<div class="muted">Nothing waiting.</div>';
}

function esc(s) { const d = document.createElement('div'); d.textContent = s == null ? '' : s; return d.innerHTML; }

/* ================= settings ================= */
async function openMenu() {
  const b = $('#menuBody');
  b.innerHTML = '<div class="muted">Loading…</div>';
  $('#menuSheet').classList.add('show');

  let health = {}, tasks = [];
  try { health = await (await fetch('/health')).json(); HEALTH = health; } catch (e) {}
  try { tasks  = await (await fetch('/api/tasks', { headers:{ 'x-nova-token': TOKEN } })).json(); } catch (e) {}
  if (!Array.isArray(tasks)) tasks = [];

  b.innerHTML = '';

  const status = document.createElement('div');
  status.className = 'card';
  status.innerHTML =
    '<b>Server status</b><br>' +
    'Brain: ' + esc(health.model || '—') + '<br>' +
    'Email sending: ' + (health.email ? '<span style="color:var(--teal)">on ✓</span>' : '<span style="color:var(--red)">off ✕</span>') + '<br>' +
    'Scheduled tasks: ' + (tasks.length || 0);
  b.appendChild(status);

  const engine = health.voiceReady ? 'Human voice — ElevenLabs ✓'
               : health.voice      ? 'ElevenLabs connected — pick a voice below'
               : 'Built-in browser voice';
  const vc = document.createElement('div');
  vc.className = 'card';
  vc.innerHTML = '<b>Voice</b><div class="muted" style="margin-top:6px">Engine: ' + esc(engine) + '</div>';
  const vrow = document.createElement('div'); vrow.className = 'row';
  const vb = document.createElement('button');
  vb.className = VOICE_ON ? 'ok' : 'no';
  vb.textContent = VOICE_ON ? '🔊 Voice on' : '🔇 Voice off';
  vb.onclick = () => {
    VOICE_ON = !VOICE_ON;
    localStorage.setItem(LS.voice, VOICE_ON ? '1' : '0');
    vb.className = VOICE_ON ? 'ok' : 'no';
    vb.textContent = VOICE_ON ? '🔊 Voice on' : '🔇 Voice off';
  };
  const tb = document.createElement('button');
  tb.className = 'ok'; tb.textContent = '🎧 Test voice';
  tb.onclick = () => { elFails = 0; speak('Hey Gavriel, this is Nova. I hear you loud and clear.'); };
  vrow.append(vb, tb); vc.appendChild(vrow);
  b.appendChild(vc);

  if (health.voice) {
    const pc = document.createElement('div');
    pc.className = 'card';
    pc.innerHTML = '<b>Pick a voice</b><div class="muted" style="margin-top:6px">Loading voices…</div>';
    b.appendChild(pc);
    try {
      const r = await fetch('/api/voices', { headers:{ 'x-nova-token': TOKEN } });
      const j = await r.json();
      if (j.error) throw new Error(j.error);
      pc.innerHTML = '<b>Pick a voice</b><div class="muted" style="margin-top:6px">' +
        j.voices.length + ' voices in your ElevenLabs account. Tap one to make it hers.</div>';
      j.voices.forEach(v => {
        const row = document.createElement('button');
        const active = v.id === j.current;
        row.style.cssText = 'display:block;width:100%;text-align:left;margin-top:8px;padding:10px 12px;' +
          'border-radius:11px;font-size:14px;cursor:pointer;border:1px solid ' +
          (active ? 'rgba(75,232,208,.55)' : 'rgba(150,140,255,.2)') + ';background:' +
          (active ? 'rgba(75,232,208,.14)' : 'rgba(150,140,255,.06)') + ';color:var(--ink)';
        const tags = [v.labels.accent, v.labels.gender, v.labels.description].filter(Boolean).join(' · ');
        row.innerHTML = (active ? '✓ ' : '') + '<b style="color:inherit">' + esc(v.name) + '</b>' +
          (tags ? '<span style="color:var(--dim);font-size:12px"> — ' + esc(tags) + '</span>' : '');
        row.onclick = async () => {
          try {
            await fetch('/api/voice', {
              method:'POST',
              headers:{ 'Content-Type':'application/json', 'x-nova-token': TOKEN },
              body: JSON.stringify({ voiceId: v.id })
            });
            elFails = 0;
            HEALTH.voiceReady = true;
            closeSheet('menuSheet');
            speak('This is my voice from now on. Sound good?');
          } catch (e) { alert('Error: ' + e.message); }
        };
        pc.appendChild(row);
      });
    } catch (e) {
      pc.innerHTML = '<b>Pick a voice</b><div class="muted" style="margin-top:6px">Could not load voices: ' + esc(e.message) + '</div>';
    }
  }

  if (tasks.length) {
    const tc = document.createElement('div');
    tc.className = 'card';
    tc.innerHTML = '<b>Scheduled tasks</b>';
    tasks.forEach(t => {
      const row = document.createElement('div');
      row.style.cssText = 'margin-top:8px;color:var(--dim);font-size:13px';
      row.textContent = '• ' + (t.instruction || '') + '  [' + (t.cron || '') + ']';
      tc.appendChild(row);
    });
    const hint = document.createElement('div');
    hint.className = 'muted';
    hint.style.marginTop = '8px';
    hint.textContent = 'To cancel one, just tell Nova: "cancel the task about…"';
    tc.appendChild(hint);
    b.appendChild(tc);
  }

  const lc = document.createElement('div');
  lc.className = 'card';
  lc.innerHTML = '<b>Listening</b><div class="muted" style="margin-top:6px">' +
    '🎙 Mic button — tap, talk, it sends when you stop.<br>' +
    '👂 Always-on — the mic stays open. Say <b style="color:inherit">"Hey Nova"</b> and I wake up. ' +
    'For ~12 seconds after I answer you can keep talking without the wake word.<br>' +
    '<span style="color:var(--dim)">Always-on works best on the Mac. On iPhone, Apple closes the mic on its own, ' +
    'so it will hand back to the mic button.</span></div>';
  b.appendChild(lc);

  const help = document.createElement('div');
  help.className = 'card';
  help.innerHTML = '<b>Install</b><div class="muted" style="margin-top:6px">' +
    'iPhone: Share button ⬆ → "Add to Home Screen".<br>' +
    'Mac (Safari): File → "Add to Dock".<br>' +
    'Mac (Chrome): the install icon in the address bar.</div>';
  b.appendChild(help);

  const out = document.createElement('div');
  out.className = 'card';
  const ob = document.createElement('button');
  ob.className = 'no';
  ob.style.cssText = 'width:100%;border:none;border-radius:10px;padding:10px;font-weight:600;cursor:pointer';
  ob.textContent = 'Change access code';
  ob.onclick = () => {
    localStorage.removeItem(LS.tok);
    TOKEN = '';
    $('#tok').value = '';
    closeSheet('menuSheet');
    $('#gate').classList.remove('hide');
  };
  out.appendChild(ob);
  b.appendChild(out);
}

function closeSheet(id) { $('#' + id).classList.remove('show'); }

/* ================= boot ================= */
async function boot() {
  paintWake();
  refreshPending();
  if (!micSupported()) {
    $('#mic').style.opacity = '.4';
    $('#wakeBtn').style.display = 'none';
  }
  if (!$('#log').children.length) {
    add('n', "Hey Gavriel. I'm Nova. I can research the web, actually send email, schedule tasks that run on their own, and remember what matters to you. Tap the mic to talk — or tap the ear icon and I'll stay listening for \"Hey Nova\".");
  }
  try { HEALTH = await (await fetch('/health')).json(); } catch (e) { HEALTH = { voiceReady:false }; }
  if (HEALTH.voice && !HEALTH.voiceReady) {
    add('n', 'ElevenLabs is connected but no voice is chosen yet. Open ☰ → Pick a voice.');
  }
}

if (TOKEN) boot();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(() => {}));
}

if (window.visualViewport) {
  window.visualViewport.addEventListener('resize', () => {
    $('#orbWrap').classList.toggle('mini', window.visualViewport.height < 520);
  });
}
</script>
