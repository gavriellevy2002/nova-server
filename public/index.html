<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Nova</title>

<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/icon-180.png">
<link rel="icon" href="/icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Nova">
<meta name="theme-color" content="#06040f">

<style>
:root{
  --bg:#06040f; --ink:#e9e6ff; --dim:#8b86ad;
  --teal:#4be8d0; --violet:#9d7bff; --gold:#fcd34d; --red:#ff6b6b;
  --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--ink);display:flex;flex-direction:column;position:relative}

/* ---------- ambient aura behind everything ---------- */
#aura{position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(60% 45% at 50% 30%, rgba(157,123,255,.20), transparent 70%),
             radial-gradient(90% 70% at 50% 110%, rgba(75,232,208,.10), transparent 70%),
             var(--bg);
  transition:opacity .5s}
#aura.live{animation:breathe 3.4s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.75}50%{opacity:1}}

/* ---------- header ---------- */
header{position:relative;z-index:2;padding:calc(var(--st) + 12px) 16px 8px;
  display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{font-family:Georgia,"Times New Roman",serif;letter-spacing:.42em;font-size:16px;
  display:flex;align-items:center;gap:8px}
.brand i{color:var(--teal);font-style:normal;font-size:13px}
.hbtns{display:flex;align-items:center;gap:6px}
.chip{background:rgba(150,140,255,.12);border:1px solid rgba(150,140,255,.25);
  color:var(--ink);border-radius:999px;padding:6px 11px;font-size:12px;cursor:pointer;
  white-space:nowrap;transition:.15s}
.chip:active{transform:scale(.94)}
.chip.on{background:rgba(75,232,208,.16);border-color:rgba(75,232,208,.45);color:var(--teal)}
#pend{color:var(--gold);border-color:rgba(252,211,77,.4);background:rgba(252,211,77,.1);display:none}

/* ---------- orb ---------- */
#orbWrap{position:relative;z-index:2;height:104px;display:flex;align-items:center;
  justify-content:center;flex:none;transition:height .35s}
#orbWrap.mini{height:56px}
#orb{width:70px;height:70px;border-radius:50%;position:relative;transition:.35s;
  background:radial-gradient(circle at 34% 32%, #fff9, #9d7bff 42%, #3d2a7a 74%, #140d33);
  box-shadow:0 0 34px 6px rgba(157,123,255,.42), inset 0 0 22px rgba(255,255,255,.14)}
#orbWrap.mini #orb{width:40px;height:40px}
#orb::after{content:"";position:absolute;inset:-16px;border-radius:50%;
  border:1px solid rgba(157,123,255,.22)}
body.listening #orb{background:radial-gradient(circle at 34% 32%, #fffc, #4be8d0 42%, #1c6b60 74%, #062622);
  box-shadow:0 0 48px 12px rgba(75,232,208,.55), inset 0 0 22px rgba(255,255,255,.2);
  animation:pulse .9s ease-in-out infinite}
body.thinking #orb{animation:spin 1.5s linear infinite;
  box-shadow:0 0 40px 8px rgba(157,123,255,.6), inset 0 0 22px rgba(255,255,255,.18)}
body.speaking #orb{background:radial-gradient(circle at 34% 32%, #fff9, #4be8d0 38%, #6d5bd0 76%, #140d33);
  box-shadow:0 0 56px 14px rgba(75,232,208,.5), inset 0 0 22px rgba(255,255,255,.2);
  animation:wave 1.1s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.13)}}
@keyframes wave{0%,100%{transform:scale(1)}30%{transform:scale(1.07)}60%{transform:scale(.97)}}
@keyframes spin{to{transform:rotate(360deg)}}
body.listening #aura,body.speaking #aura{opacity:1;
  background:radial-gradient(65% 50% at 50% 28%, rgba(75,232,208,.26), transparent 70%),
             radial-gradient(90% 70% at 50% 110%, rgba(157,123,255,.14), transparent 70%),
             var(--bg)}

#state{position:relative;z-index:2;text-align:center;font-size:12px;color:var(--dim);
  height:16px;margin-bottom:2px;unicode-bidi:plaintext}

/* ---------- log ---------- */
#log{position:relative;z-index:2;flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:8px 14px 4px;display:flex;flex-direction:column;gap:9px}
.m{max-width:88%;padding:11px 14px;border-radius:16px;font-size:15px;line-height:1.6;
  white-space:pre-wrap;word-wrap:break-word;unicode-bidi:plaintext;animation:rise .22s ease-out}
@keyframes rise{from{opacity:0;transform:translateY(7px)}}
.u{align-self:flex-start;background:#2a2352;border-bottom-right-radius:5px}
.n{align-self:flex-end;background:rgba(75,232,208,.09);border:1px solid rgba(75,232,208,.2);
  border-bottom-left-radius:5px}
.n.err{background:rgba(255,107,107,.1);border-color:rgba(255,107,107,.35);color:#ffc9c9}
.replay{align-self:flex-end;background:none;border:none;color:var(--teal);font-size:12px;
  cursor:pointer;padding:2px 6px;margin-top:-5px}

/* ---------- quick chips ---------- */
#quick{position:relative;z-index:2;display:flex;gap:7px;overflow-x:auto;padding:6px 14px;
  scrollbar-width:none}
#quick::-webkit-scrollbar{display:none}
#quick .chip{font-size:12px;flex:none}

/* ---------- composer ---------- */
form{position:relative;z-index:2;display:flex;gap:8px;align-items:center;
  padding:8px 12px calc(var(--sb) + 12px)}
#in{flex:1;min-width:0;background:rgba(150,140,255,.09);border:1px solid rgba(150,140,255,.2);
  border-radius:999px;color:var(--ink);padding:14px 18px;font-size:16px;outline:none}
#in:focus{border-color:rgba(75,232,208,.45)}
.rnd{width:50px;height:50px;flex:none;border-radius:50%;border:none;font-size:20px;
  display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.15s}
.rnd:active{transform:scale(.92)}
#mic{background:rgba(150,140,255,.16);border:1px solid rgba(150,140,255,.3);color:var(--ink)}
#mic.on{background:var(--teal);color:#04110e;border-color:var(--teal);
  box-shadow:0 0 20px rgba(75,232,208,.55)}
#go{background:var(--teal);color:#04110e;font-weight:700}

/* ---------- gate & sheets ---------- */
#gate{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;
  flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:26px;text-align:center}
#gate.hide{display:none}
#gate input{width:min(360px,88vw);text-align:center;background:rgba(150,140,255,.1);
  border:1px solid rgba(150,140,255,.25);border-radius:14px;color:var(--ink);
  padding:14px;font-size:16px;outline:none}
#gate button{background:var(--teal);color:#04110e;font-weight:700;border:none;
  border-radius:14px;padding:13px 34px;font-size:16px;cursor:pointer}
#gateMsg{font-size:13px;min-height:18px;color:var(--red)}

.sheet{position:fixed;inset:0;z-index:15;background:rgba(6,4,15,.9);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);display:none;
  flex-direction:column;padding:calc(var(--st) + 18px) 18px calc(var(--sb) + 18px)}
.sheet.show{display:flex}
.sheet h3{font-size:17px;margin-bottom:12px;font-weight:600}
.sheet .body{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:10px}
.card{background:rgba(150,140,255,.08);border:1px solid rgba(150,140,255,.18);
  border-radius:14px;padding:13px;font-size:14px;line-height:1.55;unicode-bidi:plaintext}
.card b{color:var(--teal);font-weight:600}
.card .row{display:flex;gap:8px;margin-top:10px}
.card .row button{flex:1;border:none;border-radius:10px;padding:9px;font-size:13px;
  font-weight:600;cursor:pointer}
.ok{background:var(--teal);color:#04110e}
.no{background:rgba(255,107,107,.18);color:#ffb4b4}
.sheet>.close{margin-top:12px;background:rgba(150,140,255,.14);border:none;color:var(--ink);
  border-radius:14px;padding:13px;font-size:15px;cursor:pointer}
.muted{color:var(--dim);font-size:13px;line-height:1.6;unicode-bidi:plaintext}
</style>
</head>
<body>
<div id="aura" class="live"></div>

<!-- ============ token gate ============ -->
<div id="gate">
  <div class="brand" style="font-size:22px">N O V A <i>✦</i></div>
  <div class="muted">הדבק את קוד הגישה שלך</div>
  <input id="tok" placeholder="NOVA_TOKEN" autocapitalize="off" autocorrect="off" spellcheck="false" type="password">
  <button onclick="tryToken()">כניסה</button>
  <div id="gateMsg"></div>
</div>

<!-- ============ app ============ -->
<header>
  <div class="brand">N O V A <i>✦</i></div>
  <div class="hbtns">
    <button class="chip" id="pend" onclick="openPending()"></button>
    <button class="chip" id="langBtn" onclick="toggleLang()">🇮🇱 עב</button>
    <button class="chip" id="hfBtn" onclick="toggleHF()">🔁</button>
    <button class="chip" onclick="openMenu()">☰</button>
  </div>
</header>

<div id="orbWrap"><div id="orb"></div></div>
<div id="state"></div>
<div id="log"></div>

<div id="quick">
  <button class="chip" onclick="quick('תחקרי את הנושא ותשלחי לי סיכום למייל')">📧 מחקר למייל</button>
  <button class="chip" onclick="quick('אילו משימות מתוזמנות יש לי?')">⏰ המשימות שלי</button>
  <button class="chip" onclick="quick('מה חשוב לדעת היום?')">📰 מה חדש</button>
  <button class="chip" onclick="quick('מה את זוכרת עליי?')">🧠 זיכרון</button>
</div>

<form onsubmit="send(event)">
  <button type="button" class="rnd" id="mic" onclick="toggleMic()">🎙</button>
  <input id="in" placeholder="דבר עם נובה…" autocomplete="off" autocorrect="off">
  <button type="submit" class="rnd" id="go">↑</button>
</form>

<!-- ============ sheets ============ -->
<div class="sheet" id="pendSheet">
  <h3>⚠ מיילים שממתינים לאישור שלך</h3>
  <div class="body" id="pendBody"></div>
  <button class="close" onclick="closeSheet('pendSheet')">סגור</button>
</div>

<div class="sheet" id="menuSheet">
  <h3>הגדרות</h3>
  <div class="body" id="menuBody"></div>
  <button class="close" onclick="closeSheet('menuSheet')">סגור</button>
</div>

<script>
'use strict';
const $ = s => document.querySelector(s);
const LS = { tok:'nv_tok', lang:'nv_lang', voice:'nv_voiceOn', hf:'nv_handsfree' };

let TOKEN    = localStorage.getItem(LS.tok) || '';
let LANG     = localStorage.getItem(LS.lang) || 'he';
let VOICE_ON = localStorage.getItem(LS.voice) !== '0';
let HANDSFREE= localStorage.getItem(LS.hf) === '1';
let busy = false, lastReply = '';

/* ================= state / aura ================= */
function setState(mode, text) {
  document.body.classList.remove('listening','thinking','speaking');
  if (mode) document.body.classList.add(mode);
  $('#state').textContent = text || '';
}

/* ================= token gate ================= */
if (TOKEN) $('#gate').classList.add('hide');

async function tryToken() {
  const v = $('#tok').value.trim();
  if (!v) { $('#gateMsg').textContent = 'צריך להקליד קוד'; return; }
  $('#gateMsg').style.color = 'var(--dim)';
  $('#gateMsg').textContent = 'בודק…';
  try {
    const r = await fetch('/api/tasks', { headers:{ 'x-nova-token': v } });
    if (r.status === 401) {
      $('#gateMsg').style.color = 'var(--red)';
      $('#gateMsg').textContent = 'קוד שגוי — זה ה-NOVA_TOKEN מ-Render';
      return;
    }
    TOKEN = v;
    localStorage.setItem(LS.tok, v);
    $('#gate').classList.add('hide');
    $('#gateMsg').textContent = '';
    unlockAudio();
    boot();
  } catch (e) {
    $('#gateMsg').style.color = 'var(--red)';
    $('#gateMsg').textContent = 'אין חיבור לשרת';
  }
}
$('#tok').addEventListener('keydown', e => { if (e.key === 'Enter') tryToken(); });

/* ================= chat ================= */
function add(who, text, isErr) {
  const d = document.createElement('div');
  d.className = 'm ' + who + (isErr ? ' err' : '');
  d.textContent = text;
  $('#log').appendChild(d);
  $('#log').scrollTop = 1e9;
  return d;
}

function quick(t) { $('#in').value = t; send(new Event('x')); }

async function send(e) {
  if (e && e.preventDefault) e.preventDefault();
  const text = $('#in').value.trim();
  if (!text || busy) return;
  $('#in').value = '';
  stopMic();
  add('u', text);
  busy = true;
  setState('thinking', 'נובה חושבת…');
  $('#orbWrap').classList.add('mini');
  const bubble = add('n', '…');

  try {
    const r = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type':'application/json', 'x-nova-token': TOKEN },
      body: JSON.stringify({ message: text })
    });
    if (r.status === 401) throw new Error('קוד הגישה נדחה. פתח ☰ ← החלף קוד.');
    const j = await r.json();
    if (j.error) throw new Error(j.error);
    bubble.textContent = j.reply;
    lastReply = j.reply;
    refreshPending(j.pending);
    setState(null, '');
    speak(j.reply);
  } catch (err) {
    bubble.textContent = 'שגיאה: ' + err.message;
    bubble.classList.add('err');
    setState(null, '');
  } finally {
    busy = false;
    $('#log').scrollTop = 1e9;
  }
}

/* ================= speech OUT ================= */
let audioReady = false;
function unlockAudio() {
  if (audioReady) return;
  try {
    const u = new SpeechSynthesisUtterance(' ');
    u.volume = 0;
    speechSynthesis.speak(u);
    audioReady = true;
  } catch (e) {}
}
document.addEventListener('touchstart', unlockAudio, { once:true });
document.addEventListener('click', unlockAudio, { once:true });

let voices = [];
function loadVoices() { voices = speechSynthesis.getVoices() || []; }
loadVoices();
if (typeof speechSynthesis !== 'undefined') speechSynthesis.onvoiceschanged = loadVoices;

function pickVoice(langCode) {
  if (!voices.length) loadVoices();
  const want = langCode.slice(0,2);
  const pool = voices.filter(v => (v.lang || '').toLowerCase().startsWith(want));
  if (!pool.length) return null;
  // prefer higher-quality named voices
  const nice = ['Carmit','Samantha','Ava','Siri','Google','Premium','Enhanced','Neural'];
  for (const n of nice) {
    const hit = pool.find(v => (v.name || '').includes(n));
    if (hit) return hit;
  }
  return pool[0];
}

function clean(t) {
  return String(t)
    .replace(/```[\s\S]*?```/g, ' ')
    .replace(/https?:\/\/\S+/g, ' ')
    .replace(/[*_#`>|~\[\]]/g, ' ')
    .replace(/\s+/g, ' ')
    .trim()
    .slice(0, 700);
}

let speakTimer = null;
function speak(text) {
  if (!VOICE_ON || !text) { if (HANDSFREE) setTimeout(startMic, 350); return; }
  const say = clean(text);
  if (!say) { if (HANDSFREE) setTimeout(startMic, 350); return; }
  try { speechSynthesis.cancel(); } catch (e) {}

  const u = new SpeechSynthesisUtterance(say);
  const code = LANG === 'he' ? 'he-IL' : 'en-US';
  u.lang = code;
  const v = pickVoice(code);
  if (v) u.voice = v;
  u.rate = 1.0; u.pitch = 1.02;

  let started = false;
  u.onstart = () => { started = true; clearTimeout(speakTimer); setState('speaking','מדברת…'); };
  u.onend   = () => { setState(null,''); if (HANDSFREE) setTimeout(startMic, 300); };
  u.onerror = () => { setState(null,''); if (HANDSFREE) setTimeout(startMic, 300); };

  clearTimeout(speakTimer);
  speakTimer = setTimeout(() => {
    if (!started) {
      setState(null,'');
      offerTap(say);
      if (HANDSFREE) setTimeout(startMic, 300);
    }
  }, 1700);

  try { speechSynthesis.speak(u); }
  catch (e) { offerTap(say); }
}

function offerTap(say) {
  const b = document.createElement('button');
  b.className = 'replay';
  b.textContent = '🔊 הקש לשמוע (בדוק שמתג ההשתקה בצד כבוי)';
  b.onclick = () => {
    b.remove();
    const u = new SpeechSynthesisUtterance(say);
    u.lang = LANG === 'he' ? 'he-IL' : 'en-US';
    const v = pickVoice(u.lang); if (v) u.voice = v;
    u.onstart = () => setState('speaking','מדברת…');
    u.onend = () => setState(null,'');
    speechSynthesis.speak(u);
  };
  $('#log').appendChild(b);
  $('#log').scrollTop = 1e9;
}

/* ================= speech IN ================= */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null, micOn = false, restarts = 0, finalText = '';

function micSupported() { return !!SR; }

function buildRec() {
  const r = new SR();
  r.lang = LANG === 'he' ? 'he-IL' : 'en-US';
  r.continuous = false;      // iOS ignores true anyway; short bursts are more reliable
  r.interimResults = true;
  r.maxAlternatives = 1;

  r.onstart = () => { micOn = true; restarts = 0; $('#mic').classList.add('on');
                      setState('listening','מקשיבה…'); };

  r.onresult = ev => {
    let interim = '';
    finalText = '';
    for (let i = ev.resultIndex; i < ev.results.length; i++) {
      const t = ev.results[i][0].transcript;
      if (ev.results[i].isFinal) finalText += t; else interim += t;
    }
    $('#in').value = (finalText || interim).trim();
  };

  r.onerror = ev => {
    if (ev.error === 'not-allowed' || ev.error === 'service-not-allowed') {
      stopMic();
      add('n', 'אין הרשאת מיקרופון. באייפון: הגדרות ← Safari ← מיקרופון ← אפשר.', true);
      return;
    }
    if (ev.error === 'no-speech') return;   // onend will handle
  };

  r.onend = () => {
    micOn = false;
    $('#mic').classList.remove('on');
    const said = $('#in').value.trim();
    if (said) { setState(null,''); send(new Event('x')); return; }
    if (HANDSFREE && restarts < 3) { restarts++; try { r.start(); return; } catch (e) {} }
    setState(null,'');
  };
  return r;
}

function startMic() {
  if (!micSupported() || busy || micOn) return;
  unlockAudio();
  try { speechSynthesis.cancel(); } catch (e) {}
  if (!rec) rec = buildRec();
  rec.lang = LANG === 'he' ? 'he-IL' : 'en-US';
  finalText = '';
  try { rec.start(); }
  catch (e) {
    try { rec.abort(); } catch (e2) {}
    rec = buildRec();
    try { rec.start(); } catch (e3) { setState(null,''); }
  }
}

function stopMic() {
  if (!rec) return;
  try { rec.stop(); } catch (e) {}
  micOn = false;
  $('#mic').classList.remove('on');
}

function toggleMic() {
  if (!micSupported()) {
    add('n','הדפדפן הזה לא תומך בזיהוי דיבור. באייפון השתמש ב-Safari, במק ב-Chrome או Safari.', true);
    return;
  }
  if (micOn) { stopMic(); setState(null,''); } else { startMic(); }
}

/* ================= toggles ================= */
function toggleLang() {
  LANG = LANG === 'he' ? 'en' : 'he';
  localStorage.setItem(LS.lang, LANG);
  paintLang();
  if (micOn) { stopMic(); setTimeout(startMic, 250); }
}
function paintLang() {
  $('#langBtn').textContent = LANG === 'he' ? '🇮🇱 עב' : '🇺🇸 EN';
  $('#in').placeholder = LANG === 'he' ? 'דבר עם נובה…' : 'Talk to Nova…';
}
function toggleHF() {
  HANDSFREE = !HANDSFREE;
  localStorage.setItem(LS.hf, HANDSFREE ? '1' : '0');
  paintHF();
  if (HANDSFREE) { add('n','מצב רצוף פעיל — נובה תמשיך להקשיב אחרי כל תשובה. באייפון ייתכן שתצטרך ללחוץ על המיקרופון מדי פעם.'); startMic(); }
}
function paintHF() { $('#hfBtn').classList.toggle('on', HANDSFREE); }

/* ================= pending emails ================= */
async function refreshPending(n) {
  if (n === undefined) {
    try {
      const r = await fetch('/api/pending', { headers:{ 'x-nova-token': TOKEN } });
      if (!r.ok) { n = 0; } else { const j = await r.json(); n = Array.isArray(j) ? j.length : 0; }
    } catch (e) { n = 0; }
  }
  const el = $('#pend');
  el.style.display = n ? 'block' : 'none';
  el.textContent = n ? ('⚠ ' + n) : '';
}

async function openPending() {
  const body = $('#pendBody');
  body.innerHTML = '<div class="muted">טוען…</div>';
  $('#pendSheet').classList.add('show');
  let list = [];
  try {
    const r = await fetch('/api/pending', { headers:{ 'x-nova-token': TOKEN } });
    list = await r.json();
  } catch (e) {}
  if (!list.length) { body.innerHTML = '<div class="muted">אין מיילים ממתינים.</div>'; return; }
  body.innerHTML = '';
  list.forEach(p => {
    const c = document.createElement('div');
    c.className = 'card';
    const head = document.createElement('div');
    head.innerHTML = '<b>אל:</b> ' + esc(p.to) + '<br><b>נושא:</b> ' + esc(p.subject || '');
    const pre = document.createElement('div');
    pre.style.cssText = 'margin-top:8px;color:var(--dim);white-space:pre-wrap;max-height:200px;overflow:auto';
    pre.textContent = p.body || '';
    const row = document.createElement('div');
    row.className = 'row';
    const yes = document.createElement('button');
    yes.className = 'ok'; yes.textContent = '✓ שלח';
    yes.onclick = () => act('/api/approve', p.id, c);
    const no = document.createElement('button');
    no.className = 'no'; no.textContent = '✕ מחק';
    no.onclick = () => act('/api/reject', p.id, c);
    row.append(yes, no);
    c.append(head, pre, row);
    body.appendChild(c);
  });
}

async function act(url, id, card) {
  card.style.opacity = '.45';
  try {
    const r = await fetch(url, {
      method:'POST',
      headers:{ 'Content-Type':'application/json', 'x-nova-token': TOKEN },
      body: JSON.stringify({ id })
    });
    const j = await r.json();
    if (j.error) throw new Error(j.error);
    card.remove();
  } catch (e) {
    card.style.opacity = '1';
    alert('שגיאה: ' + e.message);
  }
  refreshPending();
  if (!$('#pendBody').children.length) $('#pendBody').innerHTML = '<div class="muted">אין מיילים ממתינים.</div>';
}

function esc(s) { const d = document.createElement('div'); d.textContent = s == null ? '' : s; return d.innerHTML; }

/* ================= menu ================= */
async function openMenu() {
  const b = $('#menuBody');
  b.innerHTML = '<div class="muted">טוען…</div>';
  $('#menuSheet').classList.add('show');

  let health = {}, tasks = [];
  try { health = await (await fetch('/health')).json(); } catch (e) {}
  try { tasks  = await (await fetch('/api/tasks', { headers:{ 'x-nova-token': TOKEN } })).json(); } catch (e) {}
  if (!Array.isArray(tasks)) tasks = [];

  b.innerHTML = '';

  const status = document.createElement('div');
  status.className = 'card';
  status.innerHTML =
    '<b>מצב השרת</b><br>' +
    'מוח: ' + esc(health.model || '—') + '<br>' +
    'שליחת מייל: ' + (health.email ? '<span style="color:var(--teal)">פעילה ✓</span>' : '<span style="color:var(--red)">כבויה ✕</span>') + '<br>' +
    'משימות מתוזמנות: ' + (tasks.length || 0);
  b.appendChild(status);

  const vc = document.createElement('div');
  vc.className = 'card';
  vc.innerHTML = '<b>קול</b><div class="muted" style="margin-top:6px">האם נובה תקריא את התשובות שלה בקול.</div>';
  const vrow = document.createElement('div'); vrow.className = 'row';
  const vb = document.createElement('button');
  vb.className = VOICE_ON ? 'ok' : 'no';
  vb.textContent = VOICE_ON ? '🔊 קול פעיל' : '🔇 קול כבוי';
  vb.onclick = () => {
    VOICE_ON = !VOICE_ON;
    localStorage.setItem(LS.voice, VOICE_ON ? '1' : '0');
    vb.className = VOICE_ON ? 'ok' : 'no';
    vb.textContent = VOICE_ON ? '🔊 קול פעיל' : '🔇 קול כבוי';
  };
  const tb = document.createElement('button');
  tb.className = 'ok'; tb.textContent = '🎧 בדיקת קול';
  tb.onclick = () => speak(LANG === 'he' ? 'היי גבריאל, אני נובה. אני שומעת אותך מצוין.' : 'Hey Gavriel, this is Nova. I hear you loud and clear.');
  vrow.append(vb, tb); vc.appendChild(vrow);
  b.appendChild(vc);

  if (tasks.length) {
    const tc = document.createElement('div');
    tc.className = 'card';
    tc.innerHTML = '<b>משימות מתוזמנות</b>';
    tasks.forEach(t => {
      const row = document.createElement('div');
      row.style.cssText = 'margin-top:8px;color:var(--dim);font-size:13px';
      row.textContent = '• ' + (t.instruction || '') + '  [' + (t.cron || '') + ']';
      tc.appendChild(row);
    });
    const hint = document.createElement('div');
    hint.className = 'muted';
    hint.style.marginTop = '8px';
    hint.textContent = 'לביטול — בקש מנובה: "בטלי את המשימה של…"';
    tc.appendChild(hint);
    b.appendChild(tc);
  }

  const help = document.createElement('div');
  help.className = 'card';
  help.innerHTML = '<b>התקנה</b><div class="muted" style="margin-top:6px">' +
    'אייפון: כפתור השיתוף ⬆ ← "הוסף למסך הבית".<br>' +
    'מק (Safari): קובץ ← "הוסף לרציף".<br>' +
    'מק (Chrome): אייקון ההתקנה בשורת הכתובת.</div>';
  b.appendChild(help);

  const out = document.createElement('div');
  out.className = 'card';
  const ob = document.createElement('button');
  ob.className = 'no'; ob.style.cssText = 'width:100%;border:none;border-radius:10px;padding:10px;font-weight:600;cursor:pointer';
  ob.textContent = 'החלף קוד גישה';
  ob.onclick = () => {
    localStorage.removeItem(LS.tok);
    TOKEN = '';
    $('#tok').value = '';
    closeSheet('menuSheet');
    $('#gate').classList.remove('hide');
  };
  out.appendChild(ob);
  b.appendChild(out);
}

function closeSheet(id) { $('#' + id).classList.remove('show'); }

/* ================= boot ================= */
function boot() {
  paintLang();
  paintHF();
  refreshPending();
  if (!$('#log').children.length) {
    const hi = LANG === 'he'
      ? 'היי גבריאל. אני נובה. אני יכולה לחקור באינטרנט, לשלוח מיילים באמת, לתזמן משימות שירוצו לבד ולזכור מה שחשוב לך. דבר איתי — או הקש על המיקרופון.'
      : "Hey Gavriel. I'm Nova. I can research the web, actually send email, schedule recurring tasks and remember what matters. Talk to me, or tap the mic.";
    add('n', hi);
  }
  if (!micSupported()) {
    $('#mic').style.opacity = '.4';
    $('#hfBtn').style.display = 'none';
  }
}

if (TOKEN) boot();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(() => {}));
}

// keep the layout sane when the iOS keyboard opens
if (window.visualViewport) {
  window.visualViewport.addEventListener('resize', () => {
    $('#orbWrap').classList.toggle('mini', window.visualViewport.height < 520);
  });
}
</script>
</body>
</html>
